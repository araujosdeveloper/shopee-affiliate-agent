name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: quality-and-unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: pytest tests/unit
      - run: pip-audit
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  containers:
    name: containers-and-integration
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: shopee-affiliate-agent-ci-${{ github.run_id }}
      NETWORK_NAMESPACE: shopee-ci-${{ github.run_id }}
      VOLUME_NAMESPACE: shopee-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate temporary environment
        run: ./scripts/generate-env.sh
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build containers
        run: docker compose build
      - name: Start isolated stack
        run: docker compose up -d --wait
      - name: Run integration tests
        run: docker compose --profile test run --rm test pytest -p no:cacheprovider
      - name: Validate migration boundaries
        run: |
          docker compose run --rm migrate alembic downgrade 20260921_0005
          docker compose run --rm migrate alembic upgrade 20260921_0006
          docker compose run --rm migrate alembic downgrade 20260921_0005
          docker compose run --rm migrate alembic upgrade head
          docker compose run --rm migrate alembic downgrade base
          docker compose run --rm migrate alembic upgrade head
      - name: Validate offline migration SQL
        run: |
          docker compose run --rm migrate alembic upgrade head --sql > /tmp/phase2-upgrade.sql
          docker compose run --rm migrate alembic downgrade 20260921_0006:20260921_0005 --sql > /tmp/phase2-downgrade.sql
      - name: Validate isolated backup and restore
        run: |
          mkdir -p /tmp/shopee-affiliate-agent-backups
          backup_path=$(./scripts/backup.sh /tmp/shopee-affiliate-agent-backups)
          ./scripts/restore-test.sh "$backup_path"
      - name: Verify network and port isolation
        run: |
          python - <<'PY'
          import json
          import subprocess

          config = json.loads(subprocess.check_output(["docker", "compose", "config", "--format", "json"]))
          assert all("ports" not in service for service in config["services"].values())
          assert all(network.get("internal") is True for network in config["networks"].values())
          print("No published ports; all project networks are internal")
          PY
      - name: Record container resource usage
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
      - name: Cleanup runner resources
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true
          rm -f .env
